<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotogram</title>
    <link rel="icon" href="./assets/icons/favicon.svg" />
    <link rel="stylesheet" href="./variables.css" />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <header>
     <a href="./index.html"><img src="./assets/icons/logo.svg" alt="fotogram-logo" /></a> 
      <a href="./index.html"><img src="./assets/icons/fotogram.svg" alt="Fotogram" /></a> 
    </header>
    <main>
      <h1>Your personal photo album</h1>
      <div class="photo-album" id="photo-album"></div>
    </main>
    <dialog id="image-dialog">
      <header class="dialog-header">
        <h2 id="dialog-title"></h2>
        <button
          class="dialog-close"
          onclick="closeDialog()"
          aria-label="Close dialog"
        >
          <img src="./assets/icons/close.svg" alt="" />
        </button>
      </header>

      <img class="dialog-image" id="dialog-image" src="" alt="" />

      <footer class="dialog-footer">
        <button
          class="dialog-button"
          onclick="showPreviousImage()"
          aria-label="Previous image"
        >
          <img src="./assets/icons/arrow-left.svg" alt="" />
        </button>
        <p class="image-counter" id="image-counter"></p>
        <button
          class="dialog-button"
          onclick="showNextImage()"
          aria-label="Next image"
        >
          <img src="./assets/icons/arrow-right.svg" alt="" />
        </button>
      </footer>
    </dialog>
    <footer>
      <img src="./assets/icons/da-logo.svg" alt="Developer Akademie" />
      <p class="footer">© 2023 Developer Akademie GmbH</p>
    </footer>
  </body>
</html>
